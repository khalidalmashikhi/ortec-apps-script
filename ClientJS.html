<script>
const state={lang:'ar',data:null,token:localStorage.getItem('ortec_session')||''};
const LABELS={roles:{OWNER:'مالك',ADMIN:'مدير نظام',ACCOUNTANT:'محاسب',BRANCH_MANAGER:'مدير فرع',CASHIER:'بائع',TECHNICIAN:'فني',VIEWER:'مشاهد'},branches:{ALL:'جميع الفروع',AWQAD:'فرع عوقد',SAADA:'فرع السعادة',ITTIN:'مربع إتين',OUTSIDE:'خارج الفروع'},statuses:{OPEN:'مفتوحة',IN_PROGRESS:'قيد التنفيذ',COMPLETED:'مكتملة',APPROVED:'معتمدة',PENDING_APPROVAL:'بانتظار الاعتماد',PAID:'مدفوع',PENDING:'معلّق'},severity:{CRITICAL:'حرجة',HIGH:'عالية',MEDIUM:'متوسطة',LOW:'منخفضة'},issues:{POSSIBLE_DUPLICATE:'سجلات منتج مكررة محتملة',MISSING_COST:'تكلفة المنتج مفقودة أو صفر',NEGATIVE_STOCK:'مخزون سالب',TRANSFER_SUGGESTION:'اقتراح تحويل مخزون'}};

document.addEventListener('DOMContentLoaded',initializeApp);
function initializeApp(){const today=new Date().toISOString().slice(0,10);['importDate','exDate','reportFrom','reportTo'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=today;});if(state.token)loadBootstrapData();else showLogin();document.getElementById('loginPassword')?.addEventListener('keydown',e=>{if(e.key==='Enter')submitLogin();});}
function showLogin(){document.getElementById('loginScreen')?.classList.remove('hidden');document.getElementById('appShell')?.classList.add('hidden');}
function showApp(){document.getElementById('loginScreen')?.classList.add('hidden');document.getElementById('appShell')?.classList.remove('hidden');}
function clearSession(){state.token='';state.data=null;localStorage.removeItem('ortec_session');}
function submitLogin(){const username=getValue('loginUsername').trim(),password=getValue('loginPassword'),remember=Boolean(document.getElementById('rememberMe')?.checked),box=document.getElementById('loginError');if(box)box.textContent='';if(!username||!password){if(box)box.textContent='أدخل اسم المستخدم وكلمة المرور.';return;}setBusy(true);google.script.run.withSuccessHandler(result=>{setBusy(false);if(!result||result.ok!==true||!result.token){console.error('Invalid login response:',result);if(box)box.textContent='تعذر تسجيل الدخول: لم تصل استجابة صحيحة من الخادم.';return;}state.token=String(result.token);localStorage.setItem('ortec_session',state.token);loadBootstrapData();}).withFailureHandler(error=>{setBusy(false);if(box)box.textContent=error?.message||String(error||'تعذر تسجيل الدخول.');}).login(username,password,remember);}
function performLogout(){const token=state.token;clearSession();showLogin();if(token)google.script.run.withFailureHandler(()=>{}).logout(token);}
function loadBootstrapData(){if(!state.token){showLogin();return;}setBusy(true);google.script.run.withSuccessHandler(handleBootstrapSuccess).withFailureHandler(handleServerFailure).getBootstrapData(state.token);}
function handleBootstrapSuccess(data){setBusy(false);if(!data||!data.app||!data.user){clearSession();showLogin();showError('تعذر تحميل بيانات النظام. سجّل الدخول من جديد.');return;}state.data=data;showApp();renderApp();}
function renderApp(){document.getElementById('version').textContent=`v${state.data.app.version}`;const u=state.data.user;document.getElementById('currentUserLabel').textContent=`${u.name_ar||u.username} — ${LABELS.roles[u.role]||u.role}`;const permissions=state.data.permissions||[];document.querySelectorAll('#mainNav [data-view]').forEach(b=>b.classList.toggle('hidden',!permissions.includes(b.dataset.view)));renderDashboard();renderIssues();renderTasks();renderUsers();showView(permissions[0]||'dashboard');}
function renderDashboard(){const d=state.data.dashboard||{},a=state.data.analysis||{};const pay=d.paymentBreakdown||{available:false};const paymentNote=pay.available?'':`<p class="data-note">\u0637\u0631\u064a\u0642\u0629 \u0627\u0644\u062f\u0641\u0639 (\u0646\u0642\u062f\u064a / \u0628\u0637\u0627\u0642\u0629 / \u062a\u062d\u0648\u064a\u0644) \u063a\u064a\u0631 \u0645\u062a\u0648\u0641\u0631\u0629 \u0641\u064a \u062a\u0642\u0631\u064a\u0631 Loyverse \u0627\u0644\u0645\u0633\u062a\u0648\u0631\u062f\u060c \u0644\u0630\u0644\u0643 \u0644\u0627 \u064a\u0639\u0631\u0636 \u0627\u0644\u0646\u0638\u0627\u0645 \u062a\u0648\u0632\u064a\u0639 \u0627\u0644\u0645\u0628\u064a\u0639\u0627\u062a \u062d\u0633\u0628 \u0637\u0631\u064a\u0642\u0629 \u0627\u0644\u062f\u0641\u0639 \u0648\u0644\u0627 \u0635\u0627\u0641\u064a \u0627\u0644\u062d\u0631\u0643\u0629 \u0627\u0644\u0646\u0642\u062f\u064a\u0629.</p>`;const margin=Number(d.sales)?Number(a.grossProfit||0)/Number(d.sales)*100:0;const cards=[['مبيعات اليوم',formatMoney(d.sales)],['عدد الفواتير',Number(d.orders||0)],['متوسط الفاتورة',formatMoney(d.averageOrder)],['ربح الأصناف',formatMoney(a.grossProfit)],['هامش الربح',`${margin.toFixed(1)}%`],['المصروفات',formatMoney(d.expenses)],['صافي الربح التقديري',formatMoney(a.estimatedNetProfit)],['قيمة المخزون',formatMoney(a.inventoryValue)],['مخزون منخفض',Number(a.lowStockCount||0)],['مخزون سالب',Number(a.negativeStockCount||0)],['ملاحظات مفتوحة',Number(d.openIssues||0)]];const branch=(a.branchPerformance||[]),max=Math.max(1,...branch.map(x=>Number(x.sales)||0));const branchRows=branch.map(r=>[LABELS.branches[r.branchId]||r.branchId,formatMoney(r.sales),formatMoney(r.profit),Number(r.quantity||0).toFixed(0)]);const bars=branch.map(r=>`<div class="bar-row"><span>${escapeHtml(LABELS.branches[r.branchId]||r.branchId)}</span><div class="bar"><i style="width:${Math.max(3,(Number(r.sales)||0)/max*100)}%"></i></div><b>${formatMoney(r.sales)}</b></div>`).join('');const topRows=(a.topItems||[]).map(r=>[r.sku||'-',r.itemName,Number(r.quantity||0).toFixed(0),formatMoney(r.sales),formatMoney(r.profit)]);const lowRows=(a.lowStock||[]).slice(0,20).map(r=>[LABELS.branches[r.branch_id]||r.branch_id,r.sku||'-',r.item_name,Number(r.stock||0),Number(r.low_stock_threshold||0)]);document.getElementById('dashboard').innerHTML=`<div class="page-head"><div><h2>التحليل اليومي</h2><p>المبيعات والربحية والمخزون بتاريخ ${escapeHtml(d.date||'')}</p></div><div class="action-row"><button onclick="quickDailyPdf()">طباعة PDF</button><button onclick="showView('reports')">إرسال تقرير</button></div></div><div class="cards">${cards.map(c=>`<div class="card"><span>${escapeHtml(c[0])}</span><strong>${escapeHtml(c[1])}</strong></div>`).join('')}</div>${paymentNote}<div class="panel chart-panel"><h3>مبيعات الفروع</h3>${bars||'<p class="empty">لا توجد بيانات.</p>'}</div><div class="analysis-grid"><div><h3>أداء الفروع</h3>${createTable(['الفرع','المبيعات','الربح','الكمية'],branchRows)}</div><div><h3>أفضل الأصناف مبيعًا</h3>${createTable(['SKU','الصنف','الكمية','المبيعات','الربح'],topRows)}</div></div><h3>أهم تنبيهات المخزون</h3>${createTable(['الفرع','SKU','الصنف','المتوفر','حد التنبيه'],lowRows)}`;}
function renderIssues(){const rows=Array.isArray(state.data.issues)?state.data.issues:[];const box=document.getElementById('issues');box.innerHTML=`<div class="page-head"><h2>تنبيهات المخزون</h2></div><div class="panel filters"><select id="issueSeverity" onchange="applyIssueFilters()"><option value="ALL">كل الأهميات</option><option value="CRITICAL">حرجة</option><option value="HIGH">عالية</option><option value="MEDIUM">متوسطة</option><option value="LOW">منخفضة</option></select><select id="issueBranch" onchange="applyIssueFilters()"><option value="ALL">كل الفروع</option><option value="AWQAD">فرع عوقد</option><option value="SAADA">فرع السعادة</option><option value="ITTIN">مربع إتين</option></select><input id="issueSearch" oninput="applyIssueFilters()" placeholder="بحث بالمنتج أو SKU"></div><div id="issueTable"></div>`;applyIssueFilters();}
function applyIssueFilters(){const rows=state.data?.issues||[],sev=getValue('issueSeverity')||'ALL',branch=getValue('issueBranch')||'ALL',q=getValue('issueSearch').trim().toLowerCase();const filtered=rows.filter(r=>(sev==='ALL'||r.severity===sev)&&(branch==='ALL'||r.branch_id===branch)&&(!q||`${r.sku} ${r.item_name} ${r.details}`.toLowerCase().includes(q)));document.getElementById('issueTable').innerHTML=createTable(['الأهمية','نوع الملاحظة','الفرع','SKU','المنتج','التفاصيل'],filtered.map(r=>[LABELS.severity[r.severity]||r.severity,LABELS.issues[r.issue_type]||r.issue_type,LABELS.branches[r.branch_id]||r.branch_id,r.sku,r.item_name,translateIssueDetails(r.details)]));}
function translateIssueDetails(v){return String(v||'').replace('Product cost is missing or zero.','تكلفة المنتج مفقودة أو تساوي صفرًا.').replace('Possible duplicate product records.','قد توجد سجلات مكررة لهذا المنتج.').replace('Negative stock:','مخزون سالب:').replace('Suggested transfer from AWQAD to SAADA.','اقتراح تحويل مخزون من عوقد إلى السعادة.').replace('Suggested transfer from SAADA to AWQAD.','اقتراح تحويل مخزون من السعادة إلى عوقد.');}
function renderTasks(){const rows=Array.isArray(state.data.tasks)?state.data.tasks:[];document.getElementById('tasks').innerHTML=`<div class="page-head"><h2>المهام</h2><button onclick="showMessage('تُرسل تذكيرات المهام المستحقة تلقائيًا الساعة 8 صباحًا مع PDF.')">نظام التذكير</button></div>${createTable(['المهمة','الأولوية','المسؤول','الحالة','تاريخ الاستحقاق'],rows.map(r=>[r.title,LABELS.severity[r.priority]||r.priority,r.assigned_to,LABELS.statuses[r.status]||r.status,r.due_date]))}`;}
function renderUsers(){const box=document.getElementById('users');if(!box)return;if(!(state.data.permissions||[]).includes('users')){box.innerHTML='';return;}const rows=state.data.users||[];box.innerHTML=`<h2>إدارة المستخدمين</h2><div class="panel form-grid"><label>اسم المستخدم<input id="uUsername" placeholder="nauman"></label><label>الاسم بالعربية<input id="uNameAr"></label><label>البريد الإلكتروني<input id="uEmail" type="email"></label><label>كلمة المرور المؤقتة<input id="uPassword" type="password"></label><label>الدور<select id="uRole"><option value="BRANCH_MANAGER">مدير فرع</option><option value="ACCOUNTANT">محاسب</option><option value="CASHIER">بائع</option><option value="TECHNICIAN">فني</option><option value="VIEWER">مشاهد</option><option value="ADMIN">مدير نظام</option></select></label><label>الفرع<select id="uBranch"><option value="ALL">جميع الفروع</option><option value="AWQAD">فرع عوقد</option><option value="SAADA">فرع السعادة</option><option value="ITTIN">مربع إتين</option></select></label><button class="primary" onclick="createUser()">إنشاء المستخدم</button></div>${createTable(['اسم المستخدم','الاسم','الدور','الفرع','الحالة','آخر دخول'],rows.map(r=>[r.username,r.name_ar,LABELS.roles[r.role]||r.role,LABELS.branches[r.branch_id]||r.branch_id,r.active?'نشط':'متوقف',r.last_login||'-']))}`;}
function createUser(){const input={username:getValue('uUsername'),name_ar:getValue('uNameAr'),email:getValue('uEmail'),password:getValue('uPassword'),role:getValue('uRole'),branch_id:getValue('uBranch'),language:'ar',active:true,must_change_password:true};setBusy(true);google.script.run.withSuccessHandler(()=>{showMessage('تم إنشاء المستخدم بنجاح.');loadBootstrapData();}).withFailureHandler(handleServerFailure).saveUser(input,state.token);}
function uploadDailyLoyverseFiles(){const receipts=document.getElementById('receiptsFile')?.files?.[0],items=document.getElementById('itemsFile')?.files?.[0];if(!receipts||!items){showError('اختر ملف الفواتير وملف الأصناف معًا.');return;}const reportDate=getValue('importDate'),branchId=getValue('importBranch')||'AUTO';setBusy(true);document.getElementById('importResult').textContent='جاري رفع تقرير الفواتير...';readFile(receipts,p1=>{p1.branchId=branchId;p1.reportDate=reportDate;google.script.run.withSuccessHandler(r1=>{document.getElementById('importResult').textContent='تم رفع الفواتير. جاري رفع الأصناف...';readFile(items,p2=>{p2.branchId=branchId;p2.reportDate=reportDate;google.script.run.withSuccessHandler(r2=>{setBusy(false);document.getElementById('importResult').textContent=JSON.stringify({receipts:r1,items:r2},null,2);showMessage('تم رفع الملفين وتحديث التحليل.');loadBootstrapData();}).withFailureHandler(handleServerFailure).uploadLoyverseFile(p2,state.token);});}).withFailureHandler(handleServerFailure).uploadLoyverseFile(p1,state.token);});}
function toggleDelivery(){const yes=getValue('exCategory')==='DELIVERY';document.getElementById('deliveryFields')?.classList.toggle('hidden',!yes);document.getElementById('invoiceLabel')?.classList.toggle('hidden',yes);}
function previewExpenseFile(){const file=document.getElementById('exInvoice')?.files?.[0],box=document.getElementById('invoicePreview');if(!file||!box){return;}box.classList.remove('hidden');if(file.type.startsWith('image/')){const url=URL.createObjectURL(file);box.innerHTML=`<img src="${url}" alt="معاينة الفاتورة"><span>${escapeHtml(file.name)}</span>`;}else box.innerHTML=`<span>📄 ${escapeHtml(file.name)}</span>`;}
function submitExpense(){const input={expenseDate:getValue('exDate'),branchId:getValue('exBranch'),amount:getValue('exAmount'),category:getValue('exCategory'),paymentMethod:getValue('exPaymentMethod'),paymentStatus:getValue('exPaymentStatus'),beneficiary:getValue('exBeneficiary'),invoiceNumber:getValue('exInvoiceNumber'),description:getValue('exDescription'),deliveryAgentName:getValue('exAgent'),deliveryCompany:getValue('exCompany'),shipmentNumber:getValue('exShipment')};const send=()=>{setBusy(true);google.script.run.withSuccessHandler(result=>{setBusy(false);document.getElementById('expenseResult').textContent=JSON.stringify(result,null,2);showMessage('تم تسجيل المصروف وإرسال PDF بالبريد.');loadBootstrapData();}).withFailureHandler(handleServerFailure).createExpense(input,state.token);};const file=document.getElementById('exInvoice')?.files?.[0];if(!file){send();return;}readFile(file,p=>{input.invoiceBase64=p.base64;input.invoiceMimeType=p.mimeType;input.invoiceFileName=p.fileName;send();});}
function reportOptions(){return{dateFrom:getValue('reportFrom'),dateTo:getValue('reportTo'),branchId:getValue('reportBranch')||'ALL'};}
function generateReportPdf(){setBusy(true);google.script.run.withSuccessHandler(r=>{setBusy(false);document.getElementById('reportResult').innerHTML=`<a class="result-link" target="_blank" href="${escapeHtml(r.url)}">فتح وتحميل ${escapeHtml(r.fileName)}</a>`;window.open(r.url,'_blank');}).withFailureHandler(handleServerFailure).createReportPdf(getValue('reportType'),reportOptions(),state.token);}
function sendReportEmail(){const email=getValue('reportEmail');if(!email){showError('أدخل بريد المستلم.');return;}setBusy(true);google.script.run.withSuccessHandler(r=>{setBusy(false);document.getElementById('reportResult').textContent=`تم إرسال PDF إلى ${r.recipients}`;showMessage('تم إرسال التقرير PDF بالبريد.');}).withFailureHandler(handleServerFailure).emailReportPdf(getValue('reportType'),reportOptions(),email,state.token);}
function quickDailyPdf(){const d=state.data?.dashboard?.date||new Date().toISOString().slice(0,10);setBusy(true);google.script.run.withSuccessHandler(r=>{setBusy(false);window.open(r.url,'_blank');}).withFailureHandler(handleServerFailure).createReportPdf('DAILY',{dateFrom:d,dateTo:d,branchId:'ALL'},state.token);}
function setLang(lang){state.lang=lang==='en'?'en':'ar';document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==id));}
function createTable(headers,rows){if(!rows.length)return '<p class="empty">لا توجد بيانات.</p>';return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function readFile(file,callback){const reader=new FileReader();reader.onload=()=>callback({base64:reader.result,fileName:file.name,mimeType:file.type||'application/octet-stream'});reader.onerror=()=>showError('تعذر قراءة الملف.');reader.readAsDataURL(file);}
function getValue(id){return document.getElementById(id)?.value||'';}function formatMoney(v){return `${Number(v||0).toFixed(3)} ر.ع`;}function setBusy(v){document.getElementById('loading')?.classList.toggle('hidden',!v);}
function handleServerFailure(error){setBusy(false);const msg=error?.message||String(error||'حدث خطأ.');console.error(error);if(/جلسة الدخول|Session|الحساب غير متاح|انتهت/.test(msg)){clearSession();showLogin();}showError(msg);}
function showMessage(m){alert(m);}function showError(m){alert(m);}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
</script>
