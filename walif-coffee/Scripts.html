var App = {
  token: null, user: null, boot: null, today: '',
  /** Promise wrapper around google.script.run; injects the session token as first arg. */
  api: function (name) {
    var args = Array.prototype.slice.call(arguments, 1);
    UI.loading(true);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (r) {
          UI.loading(false);
          if (!r || r.ok === false) {
            if (r && r.code === 'AUTH') { App.forceLogout(t('انتهت الجلسة، سجل الدخول مرة أخرى.')); return reject(new Error('__silent__')); }
            return reject(new Error(r && r.error ? r.error : 'خطأ غير متوقع'));
          }
          resolve(r);
        })
        .withFailureHandler(function (e) { UI.loading(false); reject(new Error(e && e.message ? e.message : 'تعذر الاتصال بالخادم')); });
      runner[name].apply(runner, [App.token].concat(args));
    });
  },
  start: function () {
    var saved = 'ar'; try { saved = localStorage.getItem('wc_lang') || 'ar'; } catch (e) {}
    setLang(saved);
    document.querySelectorAll('.lang-btn').forEach(function (b) { b.addEventListener('click', function () { setLang(LANG === 'ar' ? 'en' : 'ar'); }); });
    try { App.token = sessionStorage.getItem('wc_token'); } catch (e) {}
    $('#loginForm').addEventListener('submit', App.login);
    $('#btnLogout').addEventListener('click', App.logout);

      $('#loginBtn').disabled = false;

    $('#rentForm').addEventListener('submit', function (e) { submit(e, 'api_addRent', true, function () { return t('تم حفظ الإيجار.'); }); });
    $('#btnLoadRecords').addEventListener('click', loadRecords);
    loadImports();
  }
  function purchaseTotals() {
    var f = $('#purchaseForm'), total = (+f.subtotal.value || 0) + (+f.tax.value || 0) - (+f.discount.value || 0), paid = +f.paidAmount.value || 0;
    $('#purTotal').textContent = UI.money(total); $('#purRemaining').textContent = UI.money(total - paid);

  }
  function payrollNet() {
    var f = $('#payrollForm');

    }).then(function (r) {
      var p = r.preview;
      var cells = [['الملف', p.fileName], ['الفترة', p.dateFrom + ' → ' + p.dateTo], ['عدد الصفوف', p.totalRows], ['صالحة للاستيراد', p.acceptedRows], ['مكررة (في الملف/مستوردة سابقًا)', p.duplicatesInFile + ' / ' + p.duplicatesExisting],
        ['مرفوضة', p.rejectedRows], ['عدد الفواتير الفريدة', p.receipts], ['إجمالي الكمية', p.quantity], ['إجمالي المبيعات', UI.money(p.grossSales)], ['الخصومات', UI.money(p.discounts)],
        ['صافي المبيعات', UI.money(p.netSales)], ['تكلفة البضاعة', UI.money(p.costOfGoods)], ['إجمالي الربح', UI.money(p.grossProfit)], ['الضرائب', UI.money(p.taxes)], ['سجلات مرتجع', p.refunds]];
      $('#csvPreviewGrid').innerHTML = cells.map(function (c) { return '<div><b>' + UI.esc(t(c[0])) + '</b><span class="num">' + UI.esc(c[1]) + '</span></div>'; }).join('');
      var rej = $('#csvRejected');
      if (p.rejectedSamples.length) { rej.innerHTML = '<b>' + t('سجلات مرفوضة:') + '</b><br>' + p.rejectedSamples.map(UI.esc).join('<br>'); rej.classList.remove('hidden'); } else rej.classList.add('hidden');
      $('#btnImportCsv').disabled = p.acceptedRows === 0;
      $('#csvPreview').classList.remove('hidden'); $('#csvResult').classList.add('hidden');
    }).catch(UI.err);
  }
  function importCsv() {
    UI.confirm(t('اعتماد الاستيراد'), t('سيتم حفظ السجلات الصالحة في النظام. السجلات المكررة تُتجاهل تلقائيًا. متابعة؟')).then(function (ok) {
      if (!ok) return;
      return App.api('api_importSalesCsv', csvText, csvName).then(function (r) {
        $('#csvPreview').classList.add('hidden');
        $('#csvResult').className = 'alert ok';
        $('#csvResult').innerHTML = '<b>' + t('تم الاستيراد بنجاح') + '</b><br>' + t('السجلات المستوردة') + ': <span class="num">' + r.imported + '</span> · ' + t('المكررة') + ': <span class="num">' + r.duplicates + '</span> · ' + t('المرفوضة') + ': <span class="num">' + r.rejected + '</span><br>' + t('إجمالي صافي المبيعات المستوردة') + ': <span class="num">' + UI.money(r.netSales) + ' OMR</span> · ' + t('الفترة') + ': ' + UI.esc(r.dateFrom) + ' → ' + UI.esc(r.dateTo);
        $('#csvResult').classList.remove('hidden'); $('#csvFile').value = ''; csvText = '';
        loadImports();
      });
    }).catch(UI.err);
  }
  function loadImports() {
    App.api('api_listImports', 20).then(function (r) {
      $('#importsWrap').innerHTML = r.rows.length ? UI.table(['التاريخ', 'الملف', 'الفترة', 'مستورد', 'مكرر', 'مرفوض', 'صافي المبيعات', 'الحالة'].map(t), r.rows.map(function (x) {
        return [x['Uploaded At'], x['File Name'], x['Date From'] + ' → ' + x['Date To'], x['Imported Rows'], x['Duplicate Rows'], x['Rejected Rows'], UI.money(x['Net Sales']), UI.badge(x.Status, x.Status === 'OK' ? 'ok' : 'err')];
      })) : '<p class="muted">' + t('لا توجد عمليات استيراد بعد.') + '</p>';
    }).catch(UI.err);
  }
  var COLS = {
    purchases: ['Invoice Date', 'Invoice Number', 'Supplier', 'Category', 'Total', 'Paid Amount', 'Remaining Amount', 'Payment Status', 'Attachment URL'],
    expenses: ['Expense Date', 'Expense Type', 'Description', 'Amount', 'Payment Status', 'Attachment URL'],
    payroll: ['Month', 'Employee', 'Net Salary', 'Payment Date', 'Payment Status'],
    rent: ['Period', 'Landlord', 'Amount', 'Due Date', 'Status', 'Attachment URL']
  };
  var API = { purchases: 'api_listPurchases', expenses: 'api_listExpenses', payroll: 'api_listPayroll', rent: 'api_listRent' };
  function loadRecords() {
    var ent = $('#recEntity').value;
    App.api(API[ent], { limit: 200 }).then(function (r) { $('#recordsTableWrap').innerHTML = UI.recordsTable(ent, COLS[ent], r.rows, false); }).catch(UI.err);
  }
  function rerender() { if (!inited) return; loadImports(); if (!$('#acc-records').classList.contains('hidden')) loadRecords(); }
  return { init: init, rerender: rerender };
})();

document.addEventListener('DOMContentLoaded', App.start);
</script>
