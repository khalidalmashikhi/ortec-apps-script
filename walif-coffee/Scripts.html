<script>
/* ===================== Core: helpers, API bridge, UI primitives ===================== */
function $(sel) { return document.querySelector(sel); }

var UI = {
  esc: function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); },
  money: function (n) { n = Number(n) || 0; return n.toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 }); },
  int: function (n) { return (Number(n) || 0).toLocaleString('en-US'); },
  pct: function (n) { return (Number(n) || 0).toFixed(1) + '%'; },
  badge: function (t, cls) {
    if (!cls) cls = /مدفوع$|مدفوعة$|^OK$|ACTIVE/.test(String(t)) ? 'ok' : (/متأخر|غير|CANCELLED|FAILED/.test(String(t)) ? 'err' : 'warn');
    return '<span class="badge ' + cls + '">' + UI.esc(t) + '</span>';
  },
  loading: function (on, text) { $('#loader').classList.toggle('hidden', !on); if (text) $('#loaderText').textContent = text; },
  toast: function (msg, cls) {
    var t = document.createElement('div'); t.className = 'toast ' + (cls || ''); t.textContent = msg;
    $('#toasts').appendChild(t); setTimeout(function () { t.remove(); }, cls === 'err' ? 6000 : 3500);
  },
  err: function (e) { var m = e && e.message ? e.message : String(e); if (m !== '__silent__') UI.toast(m, 'err'); },
  table: function (headers, rows, escaped) {
    if (!rows || !rows.length) return '<p class="muted">لا توجد بيانات.</p>';
    var isNum = function (v) { return typeof v === 'number' || /^-?[\d,]+(\.\d+)?$/.test(String(v)); };
    return '<table><thead><tr>' + headers.map(function (h) { return '<th>' + UI.esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (v) { return '<td class="' + (isNum(v) ? 'n' : '') + '">' + (escaped || /^<(span|button|a)\b/.test(String(v)) ? v : UI.esc(v)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
  },
  recordsTable: function (entity, cols, rows, managerActions) {
    var AR = { 'Invoice Date': 'التاريخ', 'Invoice Number': 'رقم الفاتورة', Supplier: 'المورد', Category: 'التصنيف', Total: 'الإجمالي', 'Paid Amount': 'المدفوع', 'Remaining Amount': 'المتبقي', 'Payment Method': 'طريقة الدفع', 'Payment Status': 'حالة الدفع', 'Is Inventory': 'مخزون', 'Attachment URL': 'المرفق',
      'Expense Date': 'التاريخ', 'Expense Type': 'النوع', Description: 'البيان', Amount: 'المبلغ', Payee: 'المستفيد', Month: 'الشهر', Employee: 'العامل', 'Basic Salary': 'الأساسي', Allowance: 'البدل', Overtime: 'الإضافي', Deduction: 'الخصم', Advance: 'السلفة', 'Net Salary': 'الصافي', 'Payment Date': 'تاريخ الدفع',
      Period: 'الفترة', Landlord: 'المؤجر', 'Due Date': 'الاستحقاق', Status: 'الحالة', 'Record Status': 'حالة السجل', 'Created By': 'أدخله' };
    var headers = cols.map(function (c) { return AR[c] || c; }).concat(['حالة السجل', 'أدخله']).concat(managerActions ? [''] : []);
    var moneyCols = /Total|Amount|Salary|Allowance|Overtime|Deduction|Advance|Subtotal|Tax|Discount/;
    return UI.table(headers, rows.map(function (r) {
      var cells = cols.map(function (c) {
        var v = r[c];
        if (c === 'Attachment URL') return v ? '<a href="' + UI.esc(v) + '" target="_blank" rel="noopener">📎 فتح</a>' : '—';
        if (moneyCols.test(c)) return UI.money(v);
        if (/Date$/.test(c) && v) return String(v).slice(0, 10);
        if (/Status$/.test(c)) return UI.badge(v);
        return v == null ? '' : v;
      });
      cells.push(UI.badge(r['Record Status'] === 'ACTIVE' ? 'فعّال' : 'ملغى', r['Record Status'] === 'ACTIVE' ? 'ok' : 'err') + (r['Cancel Reason'] ? ' <small class="muted">' + UI.esc(r['Cancel Reason']) + '</small>' : ''));
      cells.push(r['Created By'] || '');
      if (managerActions) cells.push(r['Record Status'] === 'ACTIVE' ? '<button class="btn sm ghost" data-edit="1" data-id="' + UI.esc(r['Internal ID']) + '" type="button">تعديل</button> <button class="btn sm ghost" data-cancel="' + entity + '" data-id="' + UI.esc(r['Internal ID']) + '" type="button">إلغاء</button>' : '');
      return cells;
    }));
  },
  modal: function (html) {
    var bg = document.createElement('div'); bg.className = 'modal-bg'; bg.innerHTML = '<div class="modal">' + html + '</div>';
    $('#modalRoot').appendChild(bg); return bg;
  },
  confirm: function (title, text) {
    return new Promise(function (resolve) {
      var m = UI.modal('<h3>' + UI.esc(title) + '</h3><p>' + UI.esc(text) + '</p><div class="actions"><button class="btn" id="mOk" type="button">تأكيد</button><button class="btn ghost" id="mNo" type="button">تراجع</button></div>');
      m.querySelector('#mOk').onclick = function () { m.remove(); resolve(true); };
      m.querySelector('#mNo').onclick = function () { m.remove(); resolve(false); };
    });
  },
  prompt: function (title, text) {
    return new Promise(function (resolve) {
      var m = UI.modal('<h3>' + UI.esc(title) + '</h3><p>' + UI.esc(text) + '</p><input id="mIn" maxlength="500"><div class="actions"><button class="btn danger" id="mOk" type="button">تأكيد</button><button class="btn ghost" id="mNo" type="button">تراجع</button></div>');
      m.querySelector('#mOk').onclick = function () { var v = m.querySelector('#mIn').value.trim(); if (!v) { UI.toast('السبب مطلوب', 'err'); return; } m.remove(); resolve(v); };
      m.querySelector('#mNo').onclick = function () { m.remove(); resolve(null); };
    });
  },
  form: function (title, innerHtml) {
    return new Promise(function (resolve) {
      var m = UI.modal('<h3>' + UI.esc(title) + '</h3><form id="mForm">' + innerHtml + '<div class="actions"><button class="btn" type="submit">حفظ</button><button class="btn ghost" id="mNo" type="button">تراجع</button></div></form>');
      m.querySelector('#mForm').onsubmit = function (e) { e.preventDefault(); var d = {}; new FormData(e.target).forEach(function (v, k) { d[k] = v; }); m.remove(); resolve(d); };
      m.querySelector('#mNo').onclick = function () { m.remove(); resolve(null); };
    });
  },
  tabs: function (barSel, paneSel, onChange) {
    var bar = $(barSel);
    bar.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        bar.querySelectorAll('button').forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        document.querySelectorAll(paneSel).forEach(function (p) { p.classList.toggle('hidden', p.id !== b.dataset.tab); });
        if (onChange) onChange(b.dataset.tab);
        window.scrollTo(0, 0);
      });
    });
  },
  fillLists: function (root) {
    root.querySelectorAll('select[data-list]').forEach(function (s) {
      var list = App.boot.lists[s.dataset.list] || [];
      s.innerHTML = list.map(function (v) { return '<option value="' + UI.esc(v) + '">' + UI.esc(v) + '</option>'; }).join('');
    });
  },
  readFileText: function (file) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsText(file, 'UTF-8'); }); },
  readFileBase64: function (file) {
    return new Promise(function (res, rej) {
      if (!file) return res(null);
      var ext = (file.name.split('.').pop() || '').toLowerCase();
      if (App.boot.limits.attachmentExt.indexOf(ext) < 0) return rej(new Error('نوع المرفق غير مسموح (PDF, JPG, PNG فقط).'));
      if (file.size > App.boot.limits.attachmentBytes) return rej(new Error('حجم المرفق يتجاوز ' + Math.round(App.boot.limits.attachmentBytes / 1048576) + ' MB.'));
      var r = new FileReader(); r.onload = function () { res({ name: file.name, mimeType: file.type, base64: String(r.result).split(',')[1] }); }; r.onerror = rej; r.readAsDataURL(file);
    });
  },
  downloadBase64: function (b64, name, mime) {
    var bytes = atob(b64), arr = new Uint8Array(bytes.length);
    for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([arr], { type: mime }));
    var a = document.createElement('a'); a.href = url; a.download = name; a.target = '_blank'; document.body.appendChild(a); a.click();
    setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 4000);
  },
  formData: function (form) {
    var d = {};
    Array.prototype.forEach.call(form.elements, function (el) { if (!el.name || el.type === 'file') return; d[el.name] = el.type === 'checkbox' ? el.checked : el.value; });
    return d;
  }
};

var App = {
  token: null, user: null, boot: null, today: '',
  /** Promise wrapper around google.script.run; injects the session token as first arg. */
  api: function (name) {
    var args = Array.prototype.slice.call(arguments, 1);
    UI.loading(true);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (r) {
          UI.loading(false);
          if (!r || r.ok === false) {
            if (r && r.code === 'AUTH') { App.forceLogout('انتهت الجلسة، سجل الدخول مرة أخرى.'); return reject(new Error('__silent__')); }
            return reject(new Error(r && r.error ? r.error : 'خطأ غير متوقع'));
          }
          resolve(r);
        })
        .withFailureHandler(function (e) { UI.loading(false); reject(new Error(e && e.message ? e.message : 'تعذر الاتصال بالخادم')); });
      runner[name].apply(runner, [App.token].concat(args));
    });
  },
  start: function () {
    try { App.token = sessionStorage.getItem('wc_token'); } catch (e) {}
    $('#loginForm').addEventListener('submit', App.login);
    $('#btnLogout').addEventListener('click', App.logout);
    if (App.token) {
      App.api('api_bootstrap').then(App.enter).catch(function () { App.showLogin(); });
    } else App.showLogin();
  },
  showLogin: function () {
    UI.loading(false);
    $('#view-app').classList.add('hidden'); $('#view-login').classList.remove('hidden');
    setTimeout(function () { $('#loginUser').focus(); }, 50);
  },
  login: function (e) {
    e.preventDefault();
    var u = $('#loginUser').value.trim(), p = $('#loginPass').value;
    $('#loginError').classList.add('hidden'); $('#loginBtn').disabled = true; UI.loading(true, 'جارٍ التحقق…');
    google.script.run.withSuccessHandler(function (r) {
      $('#loginBtn').disabled = false;
      if (!r || !r.ok) { UI.loading(false); $('#loginError').textContent = (r && r.error) || 'فشل تسجيل الدخول'; $('#loginError').classList.remove('hidden'); return; }
      App.token = r.token; try { sessionStorage.setItem('wc_token', r.token); } catch (x) {}
      $('#loginPass').value = '';
      App.api('api_bootstrap').then(App.enter).catch(UI.err);
    }).withFailureHandler(function (err) { $('#loginBtn').disabled = false; UI.loading(false); $('#loginError').textContent = err.message || 'تعذر الاتصال'; $('#loginError').classList.remove('hidden'); })
      .api_login(u, p);
  },
  enter: function (boot) {
    App.boot = boot; App.user = boot.user; App.today = boot.today;
    $('#whoName').textContent = boot.user.displayName; $('#whoRole').textContent = boot.user.role === 'manager' ? 'مدير' : 'محاسب';
    $('#demoWarning').classList.toggle('hidden', !(boot.demoPasswordsActive && boot.user.role === 'manager'));
    $('#view-login').classList.add('hidden'); $('#view-app').classList.remove('hidden');
    UI.fillLists(document);
    if (boot.user.role === 'manager') { $('#view-manager').classList.remove('hidden'); $('#view-accountant').classList.add('hidden'); Mgr.init(); }
    else { $('#view-accountant').classList.remove('hidden'); $('#view-manager').classList.add('hidden'); Acc.init(); }
  },
  logout: function () {
    var t = App.token; App.token = null; try { sessionStorage.removeItem('wc_token'); } catch (e) {}
    google.script.run.api_logout(t);
    location.reload();
  },
  forceLogout: function (msg) { App.token = null; try { sessionStorage.removeItem('wc_token'); } catch (e) {} App.showLogin(); $('#loginError').textContent = msg; $('#loginError').classList.remove('hidden'); }
};

/* ===================== Accountant logic ===================== */
var Acc = (function () {
  var csvText = '', csvName = '';
  function init() {
    UI.tabs('#accTabs', '.acc-tab', function (id) { if (id === 'acc-records') loadRecords(); });
    document.querySelectorAll('#view-accountant input[type=date]').forEach(function (i) { if (!i.value && /invoiceDate|expenseDate/.test(i.name)) i.value = App.today; });
    var ym = App.today.slice(0, 7); ['#payrollForm [name=month]', '#rentForm [name=period]'].forEach(function (s) { $(s).value = ym; });
    $('#btnPreviewCsv').addEventListener('click', previewCsv);
    $('#btnImportCsv').addEventListener('click', importCsv);
    $('#btnCancelCsv').addEventListener('click', function () { $('#csvPreview').classList.add('hidden'); csvText = ''; });
    $('#btnRefreshImports').addEventListener('click', loadImports);
    $('#purchaseForm').addEventListener('input', purchaseTotals); purchaseTotals();
    $('#payrollForm').addEventListener('input', payrollNet);
    $('#purchaseForm').addEventListener('submit', function (e) { submit(e, 'api_addPurchase', true, function (r) { return 'تم حفظ الفاتورة. الإجمالي ' + UI.money(r.total) + ' والمتبقي ' + UI.money(r.remaining); }); });
    $('#expenseForm').addEventListener('submit', function (e) { submit(e, 'api_addExpense', true, function () { return 'تم حفظ المصروف.'; }); });
    $('#payrollForm').addEventListener('submit', function (e) { submit(e, 'api_addPayroll', false, function (r) { return 'تم حفظ الراتب. الصافي ' + UI.money(r.netSalary); }); });
    $('#rentForm').addEventListener('submit', function (e) { submit(e, 'api_addRent', true, function () { return 'تم حفظ الإيجار.'; }); });
    $('#btnLoadRecords').addEventListener('click', loadRecords);
    loadImports();
  }
  function purchaseTotals() {
    var f = $('#purchaseForm'), total = (+f.subtotal.value || 0) + (+f.tax.value || 0) - (+f.discount.value || 0), paid = +f.paidAmount.value || 0;
    $('#purTotal').textContent = UI.money(total); $('#purRemaining').textContent = UI.money(total - paid);
    f.paymentStatus.value = paid >= total - 0.0005 && total > 0 ? 'مدفوعة' : (paid > 0 ? 'مدفوعة جزئيًا' : 'غير مدفوعة');
  }
  function payrollNet() {
    var f = $('#payrollForm');
    $('#payNet').textContent = UI.money((+f.basicSalary.value || 0) + (+f.allowance.value || 0) + (+f.overtime.value || 0) - (+f.deduction.value || 0) - (+f.advance.value || 0));
  }
  function submit(e, apiName, withAttachment, okMsg) {
    e.preventDefault();
    var form = e.target, data = UI.formData(form);
    var fileInput = form.querySelector('input[type=file]');
    UI.readFileBase64(withAttachment && fileInput && fileInput.files[0] ? fileInput.files[0] : null).then(function (att) {
      return withAttachment ? App.api(apiName, data, att) : App.api(apiName, data);
    }).then(function (r) {
      UI.toast(okMsg(r), 'ok');
      form.reset(); UI.fillLists(form);
      form.querySelectorAll('input[type=date]').forEach(function (i) { if (/invoiceDate|expenseDate/.test(i.name)) i.value = App.today; });
      form.querySelectorAll('input[type=month]').forEach(function (i) { i.value = App.today.slice(0, 7); });
      if (form.id === 'purchaseForm') purchaseTotals(); if (form.id === 'payrollForm') payrollNet();
    }).catch(UI.err);
  }
  // ---- CSV
  function previewCsv() {
    var f = $('#csvFile').files[0];
    if (!f) { UI.toast('اختر ملف CSV أولًا', 'err'); return; }
    if (!/\.csv$/i.test(f.name)) { UI.toast('الملف يجب أن يكون بصيغة CSV', 'err'); return; }
    UI.readFileText(f).then(function (text) {
      csvText = text; csvName = f.name;
      return App.api('api_previewSalesCsv', text, f.name);
    }).then(function (r) {
      var p = r.preview;
      var cells = [['الملف', p.fileName], ['الفترة', p.dateFrom + ' → ' + p.dateTo], ['عدد الصفوف', p.totalRows], ['صالحة للاستيراد', p.acceptedRows], ['مكررة (في الملف/مستوردة سابقًا)', p.duplicatesInFile + ' / ' + p.duplicatesExisting],
        ['مرفوضة', p.rejectedRows], ['عدد الفواتير الفريدة', p.receipts], ['إجمالي الكمية', p.quantity], ['إجمالي المبيعات', UI.money(p.grossSales)], ['الخصومات', UI.money(p.discounts)],
        ['صافي المبيعات', UI.money(p.netSales)], ['تكلفة البضاعة', UI.money(p.costOfGoods)], ['إجمالي الربح', UI.money(p.grossProfit)], ['الضرائب', UI.money(p.taxes)], ['سجلات مرتجع', p.refunds]];
      $('#csvPreviewGrid').innerHTML = cells.map(function (c) { return '<div><b>' + UI.esc(c[0]) + '</b><span class="num">' + UI.esc(c[1]) + '</span></div>'; }).join('');
      var rej = $('#csvRejected');
      if (p.rejectedSamples.length) { rej.innerHTML = '<b>سجلات مرفوضة:</b><br>' + p.rejectedSamples.map(UI.esc).join('<br>'); rej.classList.remove('hidden'); } else rej.classList.add('hidden');
      $('#btnImportCsv').disabled = p.acceptedRows === 0;
      $('#csvPreview').classList.remove('hidden'); $('#csvResult').classList.add('hidden');
    }).catch(UI.err);
  }
  function importCsv() {
    UI.confirm('اعتماد الاستيراد', 'سيتم حفظ السجلات الصالحة في النظام. السجلات المكررة تُتجاهل تلقائيًا. متابعة؟').then(function (ok) {
      if (!ok) return;
      return App.api('api_importSalesCsv', csvText, csvName).then(function (r) {
        $('#csvPreview').classList.add('hidden');
        $('#csvResult').className = 'alert ok';
        $('#csvResult').innerHTML = '<b>تم الاستيراد بنجاح</b><br>السجلات المستوردة: <span class="num">' + r.imported + '</span> · المكررة: <span class="num">' + r.duplicates + '</span> · المرفوضة: <span class="num">' + r.rejected + '</span><br>إجمالي صافي المبيعات المستوردة: <span class="num">' + UI.money(r.netSales) + ' OMR</span> · الفترة: ' + UI.esc(r.dateFrom) + ' → ' + UI.esc(r.dateTo);
        $('#csvResult').classList.remove('hidden'); $('#csvFile').value = ''; csvText = '';
        loadImports();
      });
    }).catch(UI.err);
  }
  function loadImports() {
    App.api('api_listImports', 20).then(function (r) {
      $('#importsTable tbody').innerHTML = r.rows.length ? r.rows.map(function (x) {
        return '<tr><td>' + UI.esc(x['Uploaded At']) + '</td><td>' + UI.esc(x['File Name']) + '</td><td>' + UI.esc(x['Date From']) + ' → ' + UI.esc(x['Date To']) + '</td><td class="n">' + x['Imported Rows'] + '</td><td class="n">' + x['Duplicate Rows'] + '</td><td class="n">' + x['Rejected Rows'] + '</td><td class="n">' + UI.money(x['Net Sales']) + '</td><td>' + UI.badge(x.Status, x.Status === 'OK' ? 'ok' : 'err') + '</td></tr>';
      }).join('') : '<tr><td colspan="8" class="muted">لا توجد عمليات استيراد بعد.</td></tr>';
    }).catch(UI.err);
  }
  var COLS = {
    purchases: ['Invoice Date', 'Invoice Number', 'Supplier', 'Category', 'Total', 'Paid Amount', 'Remaining Amount', 'Payment Status', 'Attachment URL'],
    expenses: ['Expense Date', 'Expense Type', 'Description', 'Amount', 'Payment Status', 'Attachment URL'],
    payroll: ['Month', 'Employee', 'Net Salary', 'Payment Date', 'Payment Status'],
    rent: ['Period', 'Landlord', 'Amount', 'Due Date', 'Status', 'Attachment URL']
  };
  var API = { purchases: 'api_listPurchases', expenses: 'api_listExpenses', payroll: 'api_listPayroll', rent: 'api_listRent' };
  function loadRecords() {
    var ent = $('#recEntity').value;
    App.api(API[ent], { limit: 200 }).then(function (r) { $('#recordsTableWrap').innerHTML = UI.recordsTable(ent, COLS[ent], r.rows, false); }).catch(UI.err);
  }
  return { init: init };
})();

document.addEventListener('DOMContentLoaded', App.start);
</script>
