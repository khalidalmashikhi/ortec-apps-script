<div class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="logo">☕</div>
    <h1>والِف كوفي</h1>
    <div class="sub">Walif Coffee — النظام المالي والتشغيلي</div>
    <div id="loginError" class="alert err hidden"></div>
    <div class="field">
      <label for="loginUser">اسم المستخدم</label>
      <input id="loginUser" type="text" required autocapitalize="off" autocomplete="username" dir="ltr">
    </div>
    <div class="field">
      <label for="loginPass">كلمة المرور</label>
      <input id="loginPass" type="password" required autocomplete="current-password" dir="ltr">
    </div>
    <button class="btn" type="submit" id="loginBtn" style="width:100%;justify-content:center">دخول</button>
    <p class="muted" style="text-align:center;margin:1rem 0 0">العملة: ريال عماني (OMR) · التوقيت: مسقط</p>
  </form>
</div>
