<div class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="off">
    <div class="brand-block" aria-label="Walif — your local eatery">
      <button class="lang-btn" id="btnLangLogin" type="button">English</button>
      <svg class="brand-svg" viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg" role="img">
        <g transform="translate(112 18)" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 96 V52 a40 40 0 0 1 80 0 V96 Z"/>
          <path d="M48 92 V58"/>
          <path d="M48 58 c-6 -10 -18 -14 -30 -10 c10 2 18 6 24 12"/>
          <path d="M48 58 c6 -10 18 -14 30 -10 c-10 2 -18 6 -24 12"/>
          <path d="M48 56 c-2 -12 -12 -20 -22 -22 c8 5 14 12 17 20"/>
          <path d="M48 56 c2 -12 12 -20 22 -22 c-8 5 -14 12 -17 20"/>
          <path d="M48 54 c0 -12 -4 -22 -10 -28 c4 8 6 16 6 26"/>
          <path d="M48 54 c0 -12 4 -22 10 -28 c-4 8 -6 16 -6 26"/>
        </g>
        <text x="160" y="196" text-anchor="middle" fill="currentColor" font-family="Marcellus, Cinzel, 'Times New Roman', serif" font-size="78" letter-spacing="10" data-brand="short" textLength="0">WALIF</text>
        <text x="160" y="240" text-anchor="middle" fill="currentColor" font-family="Amiri, 'Noto Naskh Arabic', 'Segoe UI', Tahoma, serif" font-size="34" direction="rtl" unicode-bidi="bidi-override" data-brand="shortAr">وليف</text>
        <text x="160" y="274" text-anchor="middle" fill="currentColor" font-family="Marcellus, 'Segoe UI', Arial, sans-serif" font-size="11.5" letter-spacing="4.5" opacity=".85" data-brand="tagline">YOUR LOCAL EATERY</text>
      </svg>
      <img id="loginLogoImg" class="hidden" alt="" style="max-width:80%;max-height:200px;display:block">
    </div>
    <h1 data-brand="name">Walif Coffee</h1>
    <div class="sub" data-i18n>النظام المالي والتشغيلي</div>
    <div id="loginError" class="alert err hidden"></div>
    <div class="field">
      <label for="loginUser" data-i18n>اسم المستخدم</label>
      <input id="loginUser" type="text" required autocapitalize="off" autocomplete="username" dir="ltr">
    </div>
    <div class="field">
      <label for="loginPass" data-i18n>كلمة المرور</label>
      <input id="loginPass" type="password" required autocomplete="current-password" dir="ltr">
    </div>
    <button class="btn" type="submit" id="loginBtn" style="width:100%;justify-content:center" data-i18n>دخول</button>
    <p class="muted" style="text-align:center;margin:1rem 0 0" data-i18n>العملة: ريال عماني (OMR) · التوقيت: مسقط</p>
  </form>
</div>
